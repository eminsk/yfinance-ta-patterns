name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.8", "3.9", "3.10", "3.11", "3.12", "3.13", "3.14"]

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          allow-prereleases: true

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev]"

      - name: Run linter (ruff)
        if: matrix.python-version == '3.12'
        run: ruff check .

      - name: Run type checker (mypy)
        if: matrix.python-version == '3.12'
        run: mypy yfinance_ta_patterns

      - name: Run tests (pytest)
        run: pytest -v

      - name: Run release verification script
        run: python scripts/verify_release.py


  verify-platforms:
    name: Verify [all] on ${{ matrix.os }} (py${{ matrix.python-version }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        python-version: ["3.9", "3.10", "3.11", "3.12", "3.13", "3.14"]
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: false

      - name: Test current package with all extras
        shell: bash
        run: |
          uv init --no-workspace test_project --python ${{ matrix.python-version }}
          cd test_project
          uv add "$GITHUB_WORKSPACE[all]"
          uv run python -c "import talib, pandas, numpy, rich, sklearn, yfinance_ta_patterns; print('=== INSTALLED CLEANLY ON ${{ matrix.os }} ==='); print('TA-Lib:', talib.__version__); print('yftp:', yfinance_ta_patterns.__version__)"
          uv run yftp --version
          uv run python "$GITHUB_WORKSPACE/scripts/verify_release.py"
          uv add pytest
          uv run pytest "$GITHUB_WORKSPACE/tests" -q -W "ignore:.*urllib3 v2 only supports OpenSSL.*:Warning"


  verify-windows-experimental:
    name: Verify [all] on windows-latest (py${{ matrix.python-version }}${{ matrix.gil-desc }})
    runs-on: windows-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - python-version: "3.14t"
            gil-desc: " No-GIL"
            wheel_glob: "*cp314t*"
            python_gil: "0"
            verify_script: "scripts/verify_free_threaded.py"
          - python-version: "3.15t"
            gil-desc: " No-GIL"
            wheel_glob: "*cp315t*"
            python_gil: "0"
            verify_script: "scripts/verify_free_threaded.py"
          - python-version: "3.15"
            gil-desc: " (standard GIL)"
            wheel_glob: "*cp315-cp315-*"
            python_gil: "1"
            verify_script: "scripts/verify_release.py"
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: false

      - name: Download matching wheelhouse
        run: |
          gh release download v0.3.26 -R eminsk/yfinance-ta-patterns -D wheelhouse -p "${{ matrix.wheel_glob }}" -p "yfinance-1.7.0-py2.py3-none-any.whl" || true
          gh release download v0.3.30 -R eminsk/yfinance-ta-patterns -D wheelhouse -p "${{ matrix.wheel_glob }}" -p "yfinance-1.7.0-py2.py3-none-any.whl" || true
        env:
          GH_TOKEN: ${{ github.token }}

      - name: Test current package
        env:
          PYTHON_GIL: ${{ matrix.python_gil }}
        run: |
          uv init --no-workspace test_experimental --python ${{ matrix.python-version }}
          Set-Location test_experimental
          if ("${{ matrix.python-version }}" -eq "3.15") {
            Remove-Item "$env:GITHUB_WORKSPACE\wheelhouse\*cp315t*" -ErrorAction SilentlyContinue
            uv add "${env:GITHUB_WORKSPACE}[all]" --find-links "$env:GITHUB_WORKSPACE\wheelhouse" --no-build-package ta-lib
          } else {
            uv add "${env:GITHUB_WORKSPACE}[all]" --find-links "$env:GITHUB_WORKSPACE\wheelhouse" --no-build-package pandas --no-build-package curl-cffi --no-build-package ta-lib
          }
          uv run python -c "import talib, pandas, numpy, rich, yfinance_ta_patterns; print('=== INSTALLED CLEANLY ON Windows ${{ matrix.python-version }} ==='); print('TA-Lib:', talib.__version__); print('yftp:', yfinance_ta_patterns.__version__)"
          uv run python -m yfinance_ta_patterns.cli --version
          uv run python "$env:GITHUB_WORKSPACE\${{ matrix.verify_script }}"

  verify-windows-pypy:
    name: Verify [all] on windows-latest (${{ matrix.pypy-version }})
    runs-on: windows-latest
    strategy:
      fail-fast: false
      matrix:
        pypy-version: ["pypy-3.11.15", "pypy-3.10", "pypy-3.9", "pypy-3.8"]
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: false

      - name: Download PyPy wheels from release
        run: |
          for ($i = 1; $i -le 3; $i++) {
            gh release download v0.3.30 -R eminsk/yfinance-ta-patterns -D release_wheels -p "*win*" -p "*yfinance_ta_patterns*"
            if ($LASTEXITCODE -eq 0) { break }
            Start-Sleep -Seconds 3
          }
        env:
          GH_TOKEN: ${{ github.token }}

      - name: Build wheel for current workspace
        run: |
          uv build --wheel --out-dir "$env:GITHUB_WORKSPACE\dist"

      - name: Test uv add yfinance-ta-patterns[all] with PyPy wheels
        run: |
          Copy-Item -Recurse -Force release_wheels C:\release_wheels
          $testDir = "C:\test_pypy"
          Remove-Item -Recurse -Force $testDir -ErrorAction SilentlyContinue
          uv python install ${{ matrix.pypy-version }}
          $pypyExe = uv python find ${{ matrix.pypy-version }}
          & $pypyExe -m venv "$testDir\.venv"
          uv init --no-workspace $testDir
          Set-Location $testDir
          if ("${{ matrix.pypy-version }}" -eq "pypy-3.11.15") {
            uv add "pandas<=3.0.5" --find-links C:\release_wheels
          } elseif ("${{ matrix.pypy-version }}" -eq "pypy-3.10") {
            uv add "pandas<=2.3.3" "numpy==2.2.3" --find-links C:\release_wheels
          } elseif ("${{ matrix.pypy-version }}" -eq "pypy-3.9") {
            uv add "pandas<=2.3.3" "numpy<2" --find-links C:\release_wheels
          } elseif ("${{ matrix.pypy-version }}" -eq "pypy-3.8") {
            uv add "pandas<=2.0.3" "numpy<2" --find-links C:\release_wheels
          }
          $currentWheel = (Get-Item "$env:GITHUB_WORKSPACE\dist\yfinance_ta_patterns-*.whl").FullName
          uv add "${currentWheel}[all]" --find-links C:\release_wheels
          try { uv run python -c "import dateutil.tz.win as w; p = w.__file__; open(p, 'w').write(open(p).read().replace('self._tzres._handle', 'int(self._tzres._handle)'))" } catch {}
          uv run python -c "import talib, pandas, numpy, rich, yfinance_ta_patterns; print('=== INSTALLED CLEANLY ON Windows ${{ matrix.pypy-version }} ==='); print('TA-Lib:', talib.__version__); print('yftp:', yfinance_ta_patterns.__version__)"
          uv run python -m yfinance_ta_patterns.cli --version
          uv run python "$env:GITHUB_WORKSPACE\scripts\verify_release.py"
          if ("${{ matrix.pypy-version }}" -eq "pypy-3.10") {
            uv add pytest
            uv run pytest "$env:GITHUB_WORKSPACE\tests" -q -W "ignore:.*urllib3 v2 only supports OpenSSL.*:Warning"
          }


  verify-linux-pypy:
    name: Verify [all] on ubuntu-latest (${{ matrix.pypy-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        pypy-version: ["pypy-3.11.15", "pypy-3.10", "pypy-3.9", "pypy-3.8"]
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: false

      - name: Download PyPy wheels from release
        shell: bash
        run: |
          for i in 1 2 3; do
            gh release download v0.3.30 -R eminsk/yfinance-ta-patterns -D release_wheels -p "*linux*" -p "*yfinance_ta_patterns*" && break || sleep 3
          done
        env:
          GH_TOKEN: ${{ github.token }}

      - name: Build wheel for current workspace
        shell: bash
        run: uv build --wheel --out-dir "$GITHUB_WORKSPACE/dist"

      - name: Test uv add yfinance-ta-patterns[all] with PyPy wheels
        shell: bash
        env:
          PYTHONFAULTHANDLER: "1"
        run: |
          uv init --no-workspace test_pypy --python ${{ matrix.pypy-version }}
          cd test_pypy
          uv python pin ${{ matrix.pypy-version }}
          if [ "${{ matrix.pypy-version }}" = "pypy-3.11.15" ]; then
            uv add "pandas<=3.0.5" --find-links ../release_wheels
          elif [ "${{ matrix.pypy-version }}" = "pypy-3.10" ] || [ "${{ matrix.pypy-version }}" = "pypy-3.9" ]; then
            uv add "pandas<=2.2.3" "numpy<2" --find-links ../release_wheels
          elif [ "${{ matrix.pypy-version }}" = "pypy-3.8" ]; then
            uv add "pandas<=2.0.3" "numpy<2" --find-links ../release_wheels
          fi
          current_wheel=$(ls "$GITHUB_WORKSPACE/dist"/yfinance_ta_patterns-*.whl)
          uv add "${current_wheel}[all]" --find-links ../release_wheels
          uv run python -c "import talib, pandas, numpy, rich, yfinance_ta_patterns; print('=== INSTALLED CLEANLY ON Linux ${{ matrix.pypy-version }} ==='); print('TA-Lib:', talib.__version__); print('yftp:', yfinance_ta_patterns.__version__)"
          uv run python -m yfinance_ta_patterns.cli --version
          uv run python "$GITHUB_WORKSPACE/scripts/verify_release.py"
          if [ "${{ matrix.pypy-version }}" = "pypy-3.10" ]; then
            uv add pytest
            uv run pytest "$GITHUB_WORKSPACE/tests" -q -W "ignore:.*urllib3 v2 only supports OpenSSL.*:Warning"
          fi

  verify-macos-pypy:
    name: Verify [all] on macos-latest (${{ matrix.pypy-version }})
    runs-on: macos-latest
    strategy:
      fail-fast: false
      matrix:
        pypy-version: ["pypy-3.11.15", "pypy-3.10", "pypy-3.9", "pypy-3.8"]
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: false

      - name: Download PyPy wheels from release
        shell: bash
        run: |
          for i in 1 2 3; do
            gh release download v0.3.30 -R eminsk/yfinance-ta-patterns -D release_wheels -p "*macosx*" -p "*yfinance_ta_patterns*" && break || sleep 3
          done
        env:
          GH_TOKEN: ${{ github.token }}

      - name: Build wheel for current workspace
        shell: bash
        run: uv build --wheel --out-dir "$GITHUB_WORKSPACE/dist"

      - name: Test uv add yfinance-ta-patterns[all] with PyPy wheels
        shell: bash
        env:
          CC: clang
          CXX: clang++
          LDSHARED: "clang -bundle -undefined dynamic_lookup"
          LDCXXSHARED: "clang++ -bundle -undefined dynamic_lookup"
          MACOSX_DEPLOYMENT_TARGET: "11.0"
          CMAKE_BUILD_PARALLEL_LEVEL: "4"
          NPY_NUM_BUILD_JOBS: "4"
          GH_TOKEN: ${{ github.token }}
        run: |
          uv init --no-workspace test_pypy --python ${{ matrix.pypy-version }}
          cd test_pypy
          uv python pin ${{ matrix.pypy-version }}
          if [ "${{ matrix.pypy-version }}" = "pypy-3.11.15" ]; then
            uv add "pandas<=3.0.5" --find-links ../release_wheels
          elif [ "${{ matrix.pypy-version }}" = "pypy-3.10" ] || [ "${{ matrix.pypy-version }}" = "pypy-3.9" ]; then
            uv add "pandas<=2.2.3" "numpy<2" --find-links ../release_wheels
          elif [ "${{ matrix.pypy-version }}" = "pypy-3.8" ]; then
            uv add "pandas<=2.0.3" "numpy<2" --find-links ../release_wheels
            find "$(uv cache dir)" -name "pandas*pp38*.whl" -exec gh release upload v0.3.30 {} --clobber -R eminsk/yfinance-ta-patterns \; 2>/dev/null || true
          fi
          current_wheel=$(ls "$GITHUB_WORKSPACE/dist"/yfinance_ta_patterns-*.whl)
          uv add "${current_wheel}[all]" --find-links ../release_wheels
          uv run python -c "import talib, pandas, numpy, rich, yfinance_ta_patterns; print('=== INSTALLED CLEANLY ON macOS ${{ matrix.pypy-version }} ==='); print('TA-Lib:', talib.__version__); print('yftp:', yfinance_ta_patterns.__version__)"
          uv run python -m yfinance_ta_patterns.cli --version
          uv run python "$GITHUB_WORKSPACE/scripts/verify_release.py"
          if [ "${{ matrix.pypy-version }}" = "pypy-3.10" ]; then
            uv add pytest
            uv run pytest "$GITHUB_WORKSPACE/tests" -q -W "ignore:.*urllib3 v2 only supports OpenSSL.*:Warning"
          fi


  verify-38-all:
    name: Verify [all] on ${{ matrix.os }} (py3.8)
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: false

      - name: Download 3.8 wheels from release
        run: |
          gh release download v0.3.30 -R eminsk/yfinance-ta-patterns -D release_wheels -p "*ta_lib*cp38*" -p "*yfinance_ta_patterns*" || true
        env:
          GH_TOKEN: ${{ github.token }}

      - name: Test uv add yfinance-ta-patterns[all]
        shell: bash
        run: |
          uv init --no-workspace test_py38 --python 3.8
          cd test_py38
          uv add "$GITHUB_WORKSPACE[all]" --find-links ../release_wheels
          uv run python -c "import talib, pandas, numpy, rich, yfinance_ta_patterns; print('=== INSTALLED CLEANLY ON ${{ matrix.os }} (py3.8) ==='); print('TA-Lib:', talib.__version__); print('yftp:', yfinance_ta_patterns.__version__)"
          uv run yftp --version
          uv run python "$GITHUB_WORKSPACE/scripts/verify_release.py"
          uv add pytest
          uv run pytest "$GITHUB_WORKSPACE/tests" -q -W "ignore:.*urllib3 v2 only supports OpenSSL.*:Warning"
