[project]
name = "yfinance-ta-patterns"
version = "0.3.14"
description = "Institutional-grade market candlestick pattern scanner with multi-asset backtesting, AI confluence scoring, and LLM market intelligence."
readme = "README.md"
requires-python = ">=3.12"
license = "MIT"
keywords = [
    "yfinance",
    "technical-analysis",
    "candlestick-patterns",
    "ta-lib",
    "ai",
    "trading",
    "forex",
    "stocks",
    "crypto",
    "algorithmic-trading",
    "free-threaded",
    "no-gil",
    "pep-703",
]
authors = [
    { name = "eminsk", email = "M_N_Nik@yahoo.com" },
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Financial and Insurance Industry",
    "Topic :: Office/Business :: Financial :: Investment",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Programming Language :: Python :: 3.15",
    "Operating System :: OS Independent",
]
dependencies = [
    "yfinance>=0.2.66",
    "pandas>=2.2.0",
    "pytz>=2024.1",
    "numpy>=1.26",
]

[project.optional-dependencies]
talib = [
    "ta-lib>=0.6.8",
]
all = [
    "ta-lib>=0.6.8",
]
dev = [
    "pytest>=8.0",
    "pytest-cov>=4.0",
    "ruff>=0.8.0",
    "mypy>=1.11.0",
    "pandas-stubs>=2.2.0",
    "types-pytz>=2024.1",
]

[project.scripts]
yfinance-ta-patterns = "yfinance_ta_patterns.cli:main"
yftp = "yfinance_ta_patterns.cli:main"

[project.urls]
Homepage = "https://github.com/eminsk/yfinance-ta-patterns"
Repository = "https://github.com/eminsk/yfinance-ta-patterns"
Documentation = "https://github.com/eminsk/yfinance-ta-patterns#readme"
"Issue Tracker" = "https://github.com/eminsk/yfinance-ta-patterns/issues"
Changelog = "https://github.com/eminsk/yfinance-ta-patterns/releases"

[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["."]
include = ["yfinance_ta_patterns*"]

[tool.setuptools.package-data]
yfinance_ta_patterns = ["py.typed"]

[tool.pytest.ini_options]
testpaths = ["tests"]
filterwarnings = [
    "error",
    "ignore::DeprecationWarning",
    "ignore:Data repair was requested.*:UserWarning",
    "ignore:Static default FX rate used.*:UserWarning",
    "ignore:Quote currency for .* using exchange suffix heuristic.*:UserWarning",
]

[tool.ruff]
line-length = 100
target-version = "py312"
extend-exclude = [
    "release-assets",
    "release-upload",
    "tmp_download",
    "winlogs",
    "dist",
    "build",
]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "RUF"]
ignore = ["E501", "RUF001", "RUF002", "RUF003"]


[tool.mypy]
python_version = "3.12"
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = false
ignore_missing_imports = true
