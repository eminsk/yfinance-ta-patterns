name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.12", "3.13", "3.14"]

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          allow-prereleases: true

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev]"

      - name: Run linter (ruff)
        run: ruff check .

      - name: Run type checker (mypy)
        run: mypy yfinance_ta_patterns

      - name: Run tests (pytest)
        run: pytest -v

      - name: Run release verification script
        run: python scripts/verify_release.py


  verify-platforms:
    name: Verify [all] on ${{ matrix.os }} (py${{ matrix.python-version }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        python-version: ["3.9", "3.10", "3.11", "3.12", "3.13", "3.14"]
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: false

      - name: Test current package with all extras
        shell: bash
        run: |
          uv init --no-workspace test_project --python ${{ matrix.python-version }}
          cd test_project
          uv add "$GITHUB_WORKSPACE[all]"
          uv run python -c "import talib, pandas, numpy, rich, sklearn, yfinance_ta_patterns; print('=== INSTALLED CLEANLY ON ${{ matrix.os }} ==='); print('TA-Lib:', talib.__version__); print('yftp:', yfinance_ta_patterns.__version__)"
          uv run yftp --version
          uv run python "$GITHUB_WORKSPACE/scripts/verify_release.py"


  verify-windows-free-threaded:
    name: Verify [all] on windows-latest (py${{ matrix.python-version }} No-GIL)
    runs-on: windows-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - python-version: "3.14t"
            wheel_glob: "*cp314t*"
          - python-version: "3.15t"
            wheel_glob: "*cp315t*"
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: false

      - name: Download matching free-threaded wheelhouse
        run: |
          gh release download v0.3.26 -R eminsk/yfinance-ta-patterns -D wheelhouse -p "${{ matrix.wheel_glob }}" -p "yfinance-1.7.0-py2.py3-none-any.whl"
        env:
          GH_TOKEN: ${{ github.token }}

      - name: Test current package with GIL disabled
        env:
          PYTHON_GIL: "0"
        run: |
          uv init --no-workspace test_free_threaded --python ${{ matrix.python-version }}
          Set-Location test_free_threaded
          uv add "${env:GITHUB_WORKSPACE}[all]" --find-links "$env:GITHUB_WORKSPACE\wheelhouse" --no-build-package pandas --no-build-package curl-cffi --no-build-package ta-lib
          uv run python "$env:GITHUB_WORKSPACE\scripts\verify_free_threaded.py"

  verify-windows-pypy:
    name: Verify [all] on windows-latest (${{ matrix.pypy-version }})
    runs-on: windows-latest
    strategy:
      fail-fast: false
      matrix:
        pypy-version: ["pypy-3.11", "pypy-3.10", "pypy-3.9", "pypy-3.8"]
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: false

      - name: Download PyPy wheels from release
        run: |
          for ($i = 1; $i -le 3; $i++) {
            gh release download v0.3.30 -R eminsk/yfinance-ta-patterns -D release_wheels -p "*win*" -p "*yfinance_ta_patterns*"
            if ($LASTEXITCODE -eq 0) { break }
            Start-Sleep -Seconds 3
          }
        env:
          GH_TOKEN: ${{ github.token }}

      - name: Test uv add yfinance-ta-patterns[all] with PyPy wheels
        run: |
          Copy-Item -Recurse -Force release_wheels C:\release_wheels
          $testDir = "C:\test_pypy"
          Remove-Item -Recurse -Force $testDir -ErrorAction SilentlyContinue
          uv python install ${{ matrix.pypy-version }}
          $pypyExe = uv python find ${{ matrix.pypy-version }}
          & $pypyExe -m venv "$testDir\.venv"
          uv init --no-workspace $testDir
          Set-Location $testDir
          uv python pin ${{ matrix.pypy-version }}
          uv add "C:\release_wheels\yfinance_ta_patterns-0.3.30-py3-none-any.whl[all]" --find-links C:\release_wheels
          try { uv run python -c "import dateutil.tz.win as w; p = w.__file__; open(p, 'w').write(open(p).read().replace('self._tzres._handle', 'int(self._tzres._handle)'))" } catch {}
          uv run python -c "import talib, pandas, numpy, rich, yfinance_ta_patterns; print('=== INSTALLED CLEANLY ON Windows ${{ matrix.pypy-version }} ==='); print('TA-Lib:', talib.__version__); print('yftp:', yfinance_ta_patterns.__version__)"
          uv run python -m yfinance_ta_patterns.cli --version
          uv run python "$env:GITHUB_WORKSPACE\scripts\verify_release.py"


  verify-linux-pypy:
    name: Verify [all] on ubuntu-latest (${{ matrix.pypy-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        pypy-version: ["pypy-3.11", "pypy-3.10", "pypy-3.9", "pypy-3.8"]
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: false

      - name: Download PyPy wheels from release
        shell: bash
        run: |
          for i in 1 2 3; do
            gh release download v0.3.30 -R eminsk/yfinance-ta-patterns -D release_wheels -p "*linux*" -p "*yfinance_ta_patterns*" && break || sleep 3
          done
        env:
          GH_TOKEN: ${{ github.token }}

      - name: Test uv add yfinance-ta-patterns[all] with PyPy wheels
        shell: bash
        env:
          PYTHONFAULTHANDLER: "1"
        run: |
          uv init --no-workspace test_pypy --python ${{ matrix.pypy-version }}
          cd test_pypy
          uv python pin ${{ matrix.pypy-version }}
          uv add "../release_wheels/yfinance_ta_patterns-0.3.30-py3-none-any.whl[all]" --find-links ../release_wheels
          uv run python -c "import talib, pandas, numpy, rich, yfinance_ta_patterns; print('=== INSTALLED CLEANLY ON Linux ${{ matrix.pypy-version }} ==='); print('TA-Lib:', talib.__version__); print('yftp:', yfinance_ta_patterns.__version__)"
          uv run python -m yfinance_ta_patterns.cli --version
          uv run python "$GITHUB_WORKSPACE/scripts/verify_release.py"

  verify-macos-pypy:
    name: Verify [all] on macos-latest (${{ matrix.pypy-version }})
    runs-on: macos-latest
    strategy:
      fail-fast: false
      matrix:
        pypy-version: ["pypy-3.11", "pypy-3.10", "pypy-3.9", "pypy-3.8"]
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: false

      - name: Download PyPy wheels from release
        shell: bash
        run: |
          for i in 1 2 3; do
            gh release download v0.3.30 -R eminsk/yfinance-ta-patterns -D release_wheels -p "*macosx*" -p "*yfinance_ta_patterns*" && break || sleep 3
          done
        env:
          GH_TOKEN: ${{ github.token }}

      - name: Ensure pandas wheel for macOS PyPy 3.8
        if: matrix.pypy-version == 'pypy-3.8'
        env:
          CC: clang
          CXX: clang++
          LDSHARED: "clang -bundle -undefined dynamic_lookup"
          LDCXXSHARED: "clang++ -bundle -undefined dynamic_lookup"
          MACOSX_DEPLOYMENT_TARGET: "11.0"
          GH_TOKEN: ${{ github.token }}
        run: |
          if ! ls release_wheels/pandas*pp38*.whl 1> /dev/null 2>&1; then
            echo "Building pandas 2.0.3 wheel for macOS PyPy 3.8..."
            uv python install pypy-3.8
            pypyExe=$(uv python find pypy-3.8)
            "$pypyExe" -m ensurepip || true
            "$pypyExe" -m pip install --upgrade "pip>=23.3,<24.1" setuptools wheel "cython<3.0.0" build delocate || true

            "$pypyExe" -m pip install --find-links release_wheels "numpy<2" || true
            mkdir -p /tmp/pandas_src /tmp/raw_wheels
            "$pypyExe" -m pip download --no-deps "pandas==2.0.3" -d /tmp/pandas_src
            tar -xzf /tmp/pandas_src/pandas-*.tar.gz -C /tmp/pandas_src/
            cd /tmp/pandas_src/pandas-*
            "$pypyExe" -m build --wheel --no-isolation -o /tmp/raw_wheels/ || "$pypyExe" -m pip wheel . --no-deps --no-build-isolation -w /tmp/raw_wheels/ || true
            cd "$GITHUB_WORKSPACE"
            delocate-wheel --require-archs arm64 -w "$GITHUB_WORKSPACE/release_wheels/" -v /tmp/raw_wheels/pandas*.whl || cp /tmp/raw_wheels/pandas*.whl "$GITHUB_WORKSPACE/release_wheels/" || true
            gh release upload v0.3.30 "$GITHUB_WORKSPACE/release_wheels/pandas"*pp38*.whl --clobber -R eminsk/yfinance-ta-patterns || true
          fi

      - name: Test uv add yfinance-ta-patterns[all] with PyPy wheels
        shell: bash
        env:
          CC: clang
          CXX: clang++
          LDSHARED: "clang -bundle -undefined dynamic_lookup"
          LDCXXSHARED: "clang++ -bundle -undefined dynamic_lookup"
          MACOSX_DEPLOYMENT_TARGET: "11.0"
        run: |
          uv init --no-workspace test_pypy --python ${{ matrix.pypy-version }}
          cd test_pypy
          uv python pin ${{ matrix.pypy-version }}
          uv add "../release_wheels/yfinance_ta_patterns-0.3.30-py3-none-any.whl[all]" --find-links ../release_wheels
          uv run python -c "import talib, pandas, numpy, rich, yfinance_ta_patterns; print('=== INSTALLED CLEANLY ON macOS ${{ matrix.pypy-version }} ==='); print('TA-Lib:', talib.__version__); print('yftp:', yfinance_ta_patterns.__version__)"
          uv run python -m yfinance_ta_patterns.cli --version
          uv run python "$GITHUB_WORKSPACE/scripts/verify_release.py"


  verify-38-all:
    name: Verify [all] on ${{ matrix.os }} (py3.8)
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: false

      - name: Download 3.8 wheels from release
        run: |
          gh release download v0.3.30 -R eminsk/yfinance-ta-patterns -D release_wheels -p "*ta_lib*cp38*" -p "*yfinance_ta_patterns*" || true
        env:
          GH_TOKEN: ${{ github.token }}

      - name: Test uv add yfinance-ta-patterns[all]
        shell: bash
        run: |
          uv init --no-workspace test_py38 --python 3.8
          cd test_py38
          uv add "../release_wheels/yfinance_ta_patterns-0.3.30-py3-none-any.whl[all]" --find-links ../release_wheels
          uv run python -c "import talib, pandas, numpy, rich, yfinance_ta_patterns; print('=== INSTALLED CLEANLY ON ${{ matrix.os }} (py3.8) ==='); print('TA-Lib:', talib.__version__); print('yftp:', yfinance_ta_patterns.__version__)"
          uv run yftp --version
          uv run python "$GITHUB_WORKSPACE/scripts/verify_release.py"
