name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.12", "3.13", "3.14"]

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          allow-prereleases: true

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev]"

      - name: Run linter (ruff)
        run: ruff check .

      - name: Run type checker (mypy)
        run: mypy yfinance_ta_patterns

      - name: Run tests (pytest)
        run: pytest -v

  verify-platforms:
    name: Verify [all] on ${{ matrix.os }} (py${{ matrix.python-version }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        python-version: ["3.9", "3.10", "3.11", "3.12", "3.13", "3.14"]
    steps:
      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: false

      - name: Test uv add yfinance-ta-patterns[all] from PyPI
        shell: bash
        run: |
          uv init --no-workspace test_project --python ${{ matrix.python-version }}
          cd test_project
          uv add "yfinance-ta-patterns[all]==0.3.30"
          uv run python -c "import talib, pandas, numpy, rich, sklearn, yfinance_ta_patterns; print('=== INSTALLED CLEANLY ON ${{ matrix.os }} ==='); print('TA-Lib:', talib.__version__); print('yftp:', yfinance_ta_patterns.__version__)"
          uv run yftp --version

  verify-windows-315t:
    name: Verify [all] on windows-latest (py3.15t No-GIL)
    runs-on: windows-latest
    steps:
      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: false

      - name: Download 3.15 wheels from release
        run: |
          gh release download v0.3.30 -R eminsk/yfinance-ta-patterns -D release_wheels -p "*cp315*"
        env:
          GH_TOKEN: ${{ github.token }}

      - name: Test uv add yfinance-ta-patterns[all] with 3.15 wheels
        run: |
          uv init --no-workspace test_315 --python 3.15t
          cd test_315
          uv add "yfinance-ta-patterns[all]==0.3.30" --find-links ../release_wheels
          uv run python -c "import talib, pandas, numpy, rich, sklearn, yfinance_ta_patterns; print('=== INSTALLED CLEANLY ON Windows 3.15t ==='); print('TA-Lib:', talib.__version__); print('yftp:', yfinance_ta_patterns.__version__)"
          uv run yftp --version

  verify-windows-pypy:
    name: Verify [all] on windows-latest (${{ matrix.pypy-version }})
    runs-on: windows-latest
    strategy:
      fail-fast: false
      matrix:
        pypy-version: ["pypy-3.11", "pypy-3.10", "pypy-3.9", "pypy-3.8"]
    steps:
      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: false

      - name: Download PyPy wheels from release
        run: |
          gh release download v0.3.30 -R eminsk/yfinance-ta-patterns -D release_wheels -p "*win*"
        env:
          GH_TOKEN: ${{ github.token }}

      - name: Test uv add yfinance-ta-patterns[all] with PyPy wheels
        run: |
          Copy-Item -Recurse -Force release_wheels C:\release_wheels
          $testDir = "C:\test_pypy"
          Remove-Item -Recurse -Force $testDir -ErrorAction SilentlyContinue
          $pypyExe = uv python find ${{ matrix.pypy-version }}
          $pypyDir = Split-Path $pypyExe
          $env:PYTHONHOME = $pypyDir
          uv init --no-workspace $testDir --python ${{ matrix.pypy-version }}
          Set-Location $testDir
          uv python pin ${{ matrix.pypy-version }}
          uv add "yfinance-ta-patterns[all]==0.3.30" --find-links C:\release_wheels
          try { uv run python -c "import dateutil.tz.win as w; p = w.__file__; open(p, 'w').write(open(p).read().replace('self._tzres._handle', 'int(self._tzres._handle)'))" } catch {}
          uv run python -c "import talib, pandas, numpy, rich, yfinance_ta_patterns; print('=== INSTALLED CLEANLY ON Windows ${{ matrix.pypy-version }} ==='); print('TA-Lib:', talib.__version__); print('yftp:', yfinance_ta_patterns.__version__)"
          uv run python -m yfinance_ta_patterns.cli --version

  verify-linux-pypy:
    name: Verify [all] on ubuntu-latest (${{ matrix.pypy-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        pypy-version: ["pypy-3.11", "pypy-3.10", "pypy-3.9", "pypy-3.8"]
    steps:
      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: false

      - name: Download PyPy wheels from release
        run: |
          gh release download v0.3.30 -R eminsk/yfinance-ta-patterns -D release_wheels -p "*linux*"
        env:
          GH_TOKEN: ${{ github.token }}

      - name: Test uv add yfinance-ta-patterns[all] with PyPy wheels
        shell: bash
        run: |
          uv init --no-workspace test_pypy --python ${{ matrix.pypy-version }}
          cd test_pypy
          uv python pin ${{ matrix.pypy-version }}
          uv add "yfinance-ta-patterns[all]==0.3.30" --find-links ../release_wheels
          uv run python -c "import numpy; print('=== numpy OK ===', numpy.__version__)"
          uv run python -c "import talib; print('=== talib OK ===', talib.__version__)"
          uv run python -c "import pandas; print('=== pandas OK ===', pandas.__version__)"
          uv run python -c "import rich; print('=== rich OK ===')"
          uv run python -c "import yfinance_ta_patterns; print('=== yftp OK ===', yfinance_ta_patterns.__version__)"
          uv run python -c "import talib, pandas, numpy, rich, yfinance_ta_patterns; print('=== INSTALLED CLEANLY ON Linux ${{ matrix.pypy-version }} ==='); print('TA-Lib:', talib.__version__); print('yftp:', yfinance_ta_patterns.__version__)"
          uv run python -m yfinance_ta_patterns.cli --version

  verify-macos-pypy:
    name: Verify [all] on macos-latest (${{ matrix.pypy-version }})
    runs-on: macos-latest
    strategy:
      fail-fast: false
      matrix:
        pypy-version: ["pypy-3.11", "pypy-3.10", "pypy-3.9", "pypy-3.8"]
    steps:
      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: false

      - name: Download PyPy wheels from release
        run: |
          gh release download v0.3.30 -R eminsk/yfinance-ta-patterns -D release_wheels -p "*macosx*"
        env:
          GH_TOKEN: ${{ github.token }}

      - name: Test uv add yfinance-ta-patterns[all] with PyPy wheels
        shell: bash
        env:
          MACOSX_DEPLOYMENT_TARGET: "11.0"
        run: |
          uv init --no-workspace test_pypy --python ${{ matrix.pypy-version }}
          cd test_pypy
          uv python pin ${{ matrix.pypy-version }}
          uv add "yfinance-ta-patterns[all]==0.3.30" --find-links ../release_wheels
          uv run python -c "import numpy; print('=== numpy OK ===', numpy.__version__)"
          uv run python -c "import talib; print('=== talib OK ===', talib.__version__)"
          uv run python -c "import pandas; print('=== pandas OK ===', pandas.__version__)"
          uv run python -c "import rich; print('=== rich OK ===')"
          uv run python -c "import yfinance_ta_patterns; print('=== yftp OK ===', yfinance_ta_patterns.__version__)"
          uv run python -c "import talib, pandas, numpy, rich, yfinance_ta_patterns; print('=== INSTALLED CLEANLY ON macOS ${{ matrix.pypy-version }} ==='); print('TA-Lib:', talib.__version__); print('yftp:', yfinance_ta_patterns.__version__)"
          uv run python -m yfinance_ta_patterns.cli --version

  verify-38-all:
    name: Verify [all] on ${{ matrix.os }} (py3.8)
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    steps:
      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: false

      - name: Download 3.8 wheels from release
        run: |
          gh release download v0.3.30 -R eminsk/yfinance-ta-patterns -D release_wheels -p "*ta_lib*cp38*" || true
        env:
          GH_TOKEN: ${{ github.token }}

      - name: Test uv add yfinance-ta-patterns[all]
        shell: bash
        run: |
          uv init --no-workspace test_py38 --python 3.8
          cd test_py38
          uv add "yfinance-ta-patterns[all]==0.3.30" --find-links ../release_wheels
          uv run python -c "import talib, pandas, numpy, rich, yfinance_ta_patterns; print('=== INSTALLED CLEANLY ON ${{ matrix.os }} (py3.8) ==='); print('TA-Lib:', talib.__version__); print('yftp:', yfinance_ta_patterns.__version__)"
          uv run yftp --version
