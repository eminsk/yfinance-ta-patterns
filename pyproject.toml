[project]
name = "yfinance-ta-patterns"
version = "0.1.4"
description = "CLI and helpers to scan yfinance data for TA-Lib candlestick patterns."
readme = "README.md"
requires-python = ">=3.12"
license = "MIT"
authors = [
    { name = "eminsk" },
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Financial and Insurance Industry",
    "Topic :: Office/Business :: Financial :: Investment",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Operating System :: OS Independent",
]
dependencies = [
    "ta-lib>=0.6.8",
    "yfinance>=0.2.66",
    "pandas>=2.2.0",
    "pytz>=2024.1",
    "numpy>=1.26",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-cov>=4.0",
    "ruff>=0.8.0",
    "mypy>=1.11.0",
    "pandas-stubs>=2.2.0",
    "types-pytz>=2024.1",
]

[project.scripts]
yfinance-ta-patterns = "yfinance_ta_patterns.cli:main"
yftp = "yfinance_ta_patterns.cli:main"

[project.urls]
Repository = "https://github.com/eminsk/yfinance-ta-patterns"
Homepage = "https://github.com/eminsk/yfinance-ta-patterns"

[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["."]
include = ["yfinance_ta_patterns*"]

[tool.setuptools.package-data]
yfinance_ta_patterns = ["py.typed"]

[tool.pytest.ini_options]
testpaths = ["tests"]
filterwarnings = [
    "error",
    "ignore::DeprecationWarning",
]

[tool.ruff]
line-length = 100
target-version = "py312"
extend-exclude = [
    "release-assets",
    "release-upload",
    "tmp_download",
    "winlogs",
    "dist",
    "build",
]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "RUF"]
ignore = ["E501"]

[tool.mypy]
python_version = "3.12"
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = false
ignore_missing_imports = true
